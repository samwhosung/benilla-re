[package]
name = "benilla-re-storm"
description = "The Storm library of WoW.exe 1.12.1.5875: the client's MPQ archive set mounted with the exe's priorities, and its MD5 and CRC-32, tested against the exe"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
# The MPQ format and its codecs; the client's mount order is what this crate adds.
wow-mpq = "=0.6.4"

[dev-dependencies]
benilla-re-difftest.workspace = true
