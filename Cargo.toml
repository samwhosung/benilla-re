[workspace]
resolver = "2"
members = ["xtask", "crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
benilla-re-cmath = { path = "crates/cmath" }
benilla-re-collision = { path = "crates/collision" }
benilla-re-dbc = { path = "crates/dbc" }
benilla-re-difftest = { path = "crates/difftest" }
benilla-re-fastmath = { path = "crates/fastmath" }
benilla-re-objectlayer = { path = "crates/objectlayer" }
benilla-re-random = { path = "crates/random" }
benilla-re-storm = { path = "crates/storm" }

# The profile `cargo xtask check --exe` runs the tests with: optimized as a release build is, with
# the overflow and debug assertions a debug build has.
[profile.exetest]
inherits = "release"
overflow-checks = true
debug-assertions = true
strip = "none"
