name: CI

# The exe-free half of the check, on every pull request and every push to main: the formats, the
# lints, and the tests, which skip without an exe. The exe half (`cargo xtask check --exe`) needs a
# reader's own WoW.exe and runs where one is.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      # Builds the Unicorn emulator from source with the runner's CMake and C compiler. Without an
      # exe each test that needs one skips with one line.
      - name: Tests
        run: cargo test --workspace
      - name: The check
        run: cargo xtask check
